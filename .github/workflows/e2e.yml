name: Build RejectionIQ Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-android-apk:
    name: 📱 Build Android APK Package
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📱 Setup Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🐘 Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: 📦 Install Mobile Dependencies & Sync Capacitor
        run: |
          cd mobile-app
          npm install --legacy-peer-deps --engine-strict=false
          npm run build
          npx cap sync android

      - name: 🔨 Compile Android Debug APK Package
        run: |
          cd mobile-app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 🚀 Upload RejectionIQ Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RejectionIQ_Android_APK
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30
