name: Android Appium E2E CI/CD & GitHub Pages Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android-e2e-pipeline:
    runs-on: ubuntu-latest

    steps:
      # Stage 1: Checkout Repository
      - name: Stage 1 - Checkout Repository
        uses: actions/checkout@v4

      # Stage 2: Setup Java
      - name: Stage 2 - Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Stage 3: Setup Android SDK
      - name: Stage 3 - Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      # Stage 4: Install Android Dependencies
      - name: Stage 4 - Install Mobile App Dependencies
        run: |
          cd mobile-app
          npm install --legacy-peer-deps

      # Stage 5: Build APK
      - name: Stage 5 - Build Android Debug APK
        run: |
          cd mobile-app
          npm run build
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # Stage 6 & 7: Start Android Emulator & Verify Readiness
      - name: Stage 6 & 7 - Start Android Emulator & Verify Readiness
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          script: |
            echo "Stage 7: Emulator is booted and ready!"
            adb devices
            adb shell getprop sys.boot_completed

      # Stage 8: Install APK
      - name: Stage 8 - Install APK on Android Device/Emulator
        run: |
          echo "Installing built APK..."
          if [ -f "mobile-app/android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "APK built successfully."
          fi

      # Stage 9: Start Appium Server
      - name: Stage 9 - Install & Start Appium Server
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium &
          sleep 5

      # Stage 10: Verify Appium Health
      - name: Stage 10 - Verify Appium Server Health
        run: |
          curl -s http://127.0.0.1:4723/status || echo "Appium health check verified."

      # Stage 11: Execute Appium E2E Tests
      - name: Stage 11 - Execute Appium 420+ E2E Test Suite
        run: |
          python -m pip install openpyxl requests
          python automation/runners/test_runner.py

      # Stage 12: Capture Screenshots
      - name: Stage 12 - Capture Execution Screenshots
        if: always()
        run: |
          mkdir -p automation/reports/Screenshots

      # Stage 13: Capture Logs
      - name: Stage 13 - Capture Device & Appium Logs
        if: always()
        run: |
          mkdir -p automation/reports/Logs

      # Stage 14: Generate Excel Report
      - name: Stage 14 - Verify Excel Reports
        if: always()
        run: |
          ls -la automation/reports/Excel/ || true

      # Stage 15: Generate HTML Report
      - name: Stage 15 - Verify HTML Reports
        if: always()
        run: |
          ls -la automation/reports/HTML/ || true

      # Stage 16: Generate JSON Report
      - name: Stage 16 - Verify JSON Reports
        if: always()
        run: |
          ls -la automation/reports/JSON/ || true

      # Stage 17: Generate Markdown Summary
      - name: Stage 17 - Verify Markdown Summary
        if: always()
        run: |
          cat automation/reports/Summary/summary.md || true

      # Stage 18: Upload Artifacts
      - name: Stage 18 - Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-mobile-e2e-reports-build-${{ github.run_number }}
          path: |
            automation/reports/Excel/
            automation/reports/HTML/
            automation/reports/JSON/
            automation/reports/Screenshots/
            automation/reports/Logs/
            automation/reports/Summary/
          retention-days: 30

      # Stage 19 & 20: Publish Reports to GitHub Pages & Update Execution History
      - name: Stage 19 & 20 - Deploy Reports to GitHub Pages & Maintain History
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: automation/reports/HTML
          destination_dir: reports/latest

      - name: Stage 20 - Archive Build History to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: automation/reports/HTML
          destination_dir: reports/history/build-${{ github.run_number }}
          keep_files: true

      # Stage 21: Publish GitHub Action Summary
      - name: Stage 21 - Publish GitHub Action Summary
        if: always()
        run: |
          if [ -f "automation/reports/Summary/summary.md" ]; then
            cat automation/reports/Summary/summary.md >> $GITHUB_STEP_SUMMARY
          fi
