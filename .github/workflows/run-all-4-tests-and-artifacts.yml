name: Run All 4 Test Suites & Download Excel Artifacts

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # ===========================================================================
  # 1. Selenium Web E2E Test Suite (Node.js)
  # ===========================================================================
  selenium-web-tests:
    name: 🌐 1. Selenium Web E2E Tests (90 Test Cases)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install openpyxl requests
          cd selenium-web-tests
          npm install --legacy-peer-deps || true

      - name: Run Node.js Selenium Web E2E Suite
        run: |
          node selenium-web-tests/selenium_tester.js

      - name: Collect Selenium Web Excel Reports
        run: |
          mkdir -p output-selenium-excel
          cp Selenium_Web_E2E_Test_Report_RejectionIQ.xlsx output-selenium-excel/ || true
          cp selenium-web-tests/Selenium_Web_E2E_Test_Report_RejectionIQ.xlsx output-selenium-excel/ || true

      - name: 📦 Upload Selenium Web Excel Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Web-E2E-Excel-Report
          path: output-selenium-excel/
          retention-days: 30

  # ===========================================================================
  # 2. Appium Mobile & Core E2E Test Suite (Python)
  # ===========================================================================
  appium-mobile-tests:
    name: 📱 2. Appium Mobile & E2E Tests (420 Test Cases)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install openpyxl requests pytest

      - name: Execute Appium Mobile & Core E2E Test Suite
        run: |
          python appium-mobile-tests/appium_tester.py || python e2e_tester.py || true

      - name: Collect Mobile & E2E Excel Reports
        run: |
          mkdir -p output-appium-excel
          cp Appium_Mobile_E2E_Test_Report_RejectionIQ.xlsx output-appium-excel/ || true
          cp E2E_Test_Report_RejectionIQ.xlsx output-appium-excel/ || true
          cp appium-mobile-tests/Appium_Mobile_E2E_Test_Report_RejectionIQ.xlsx output-appium-excel/ || true
          if [ -d "automation/reports/Excel" ]; then
            cp automation/reports/Excel/*.xlsx output-appium-excel/ || true
          fi

      - name: 📦 Upload Appium Mobile E2E Excel Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Mobile-E2E-Excel-Reports
          path: output-appium-excel/
          retention-days: 30

  # ===========================================================================
  # 3. Backend Load & Performance Test Suite (100 Virtual Users)
  # ===========================================================================
  backend-load-tests:
    name: ⚡ 3. Backend Baseline Load Test (100 VUs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend & Load Test Dependencies
        run: |
          python -m pip install openpyxl requests uvicorn fastapi pydantic pyjwt passlib bcrypt email-validator

      - name: Start FastAPI Backend Server in Background
        run: |
          cd backend
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          sleep 4

      - name: Execute 100-VU Baseline Load Test
        run: |
          python load_tester.py --host http://127.0.0.1:8000 --users 100 --duration 60

      - name: Collect Load Test Excel & Markdown Reports
        run: |
          mkdir -p output-load-excel
          cp Load_Test_Report_RejectionIQ.xlsx output-load-excel/ || true
          cp Load_Test_Report.md output-load-excel/ || true
          cp load_test_results.json output-load-excel/ || true

      - name: 📦 Upload Load Test Excel Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backend-Load-Test-Excel-Report
          path: output-load-excel/
          retention-days: 30

  # ===========================================================================
  # 4. Security & Vulnerability Test Suite
  # ===========================================================================
  security-vulnerability-tests:
    name: 🛡️ 4. Security & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Security Tools & OpenPyXL
        run: |
          python -m pip install openpyxl semgrep requests

      - name: Generate Security Audit Spreadsheets & Reports
        run: |
          python generate_security_audit.py

      - name: Collect Security Audit Excel Spreadsheets
        run: |
          mkdir -p output-security-excel
          cp "Vulnerability Test Results/findings.xlsx" output-security-excel/ || true
          cp "Vulnerability Test Results/endpoint-inventory.xlsx" output-security-excel/ || true
          cp "Vulnerability Test Results/test-cases.xlsx" output-security-excel/ || true
          cp "Vulnerability Test Results/"*.xlsx output-security-excel/ || true

      - name: 📦 Upload Security Audit Excel Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Security-Vulnerability-Excel-Reports
          path: output-security-excel/
          retention-days: 30

  # ===========================================================================
  # 5. Consolidated Bundle - All 4 Test Excel Reports
  # ===========================================================================
  all-excel-reports-bundle:
    name: 📥 5. Bundle ALL 4 Test Excel Reports
    needs: [selenium-web-tests, appium-mobile-tests, backend-load-tests, security-vulnerability-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Selenium Web Excel Report
        uses: actions/download-artifact@v4
        with:
          name: Selenium-Web-E2E-Excel-Report
          path: all-excel-reports/1_Selenium_Web_Tests

      - name: Download Appium Mobile E2E Excel Reports
        uses: actions/download-artifact@v4
        with:
          name: Appium-Mobile-E2E-Excel-Reports
          path: all-excel-reports/2_Appium_Mobile_Tests

      - name: Download Backend Load Test Excel Report
        uses: actions/download-artifact@v4
        with:
          name: Backend-Load-Test-Excel-Report
          path: all-excel-reports/3_Backend_Load_Tests

      - name: Download Security Vulnerability Excel Reports
        uses: actions/download-artifact@v4
        with:
          name: Security-Vulnerability-Excel-Reports
          path: all-excel-reports/4_Security_Vulnerability_Audit

      - name: Display Summary of Collected Excel Reports
        run: |
          echo "======================================================="
          echo " Collected Excel Reports Across All 4 Test Suites:"
          echo "======================================================="
          find all-excel-reports/ -type f -name "*.xlsx" -o -name "*.md" -o -name "*.json"

      - name: 🚀 Upload Unified ALL Test Excel Reports Artifact
        uses: actions/upload-artifact@v4
        with:
          name: All_4_Tests_Excel_Reports_RejectionIQ
          path: all-excel-reports/
          retention-days: 30
