<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RejectionIQ - Automation Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-8 font-sans">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-extrabold text-white mb-6">Executive Test Automation Dashboard</h1>
        <div class="grid grid-cols-4 gap-6 mb-8">
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700"><p class="text-slate-400 text-xs font-bold uppercase">Total Test Cases</p><p class="text-4xl font-extrabold text-white mt-2">510</p></div>
            <div class="bg-slate-800 p-6 rounded-2xl border border-emerald-500/30"><p class="text-emerald-400 text-xs font-bold uppercase">Passed</p><p class="text-4xl font-extrabold text-emerald-400 mt-2">506</p></div>
            <div class="bg-slate-800 p-6 rounded-2xl border border-rose-500/30"><p class="text-rose-400 text-xs font-bold uppercase">Failed</p><p class="text-4xl font-extrabold text-rose-400 mt-2">3</p></div>
            <div class="bg-slate-800 p-6 rounded-2xl border border-indigo-500/30"><p class="text-indigo-400 text-xs font-bold uppercase">Pass Rate</p><p class="text-4xl font-extrabold text-indigo-400 mt-2">99.2%</p></div>
        </div>
        <a href="execution-report.html" class="inline-block px-6 py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-500 transition">View Detailed Test Log</a>
    </div>
</body>
</html>
